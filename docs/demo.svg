    <text x="400.0" y="406" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Click again to restore</text>
  </g>
  
  <circle cx="254" cy="108" r="0" fill="none" stroke="#0a84ff" stroke-width="2" opacity="0">
    <animate attributeName="r" dur="12s" repeatCount="indefinite" keyTimes="0;0.12;0.12;0.15;1" values="0;0;4;18;18"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.12;0.12;0.15;1" values="0;0;0.9;0;0"/>
  </circle>
