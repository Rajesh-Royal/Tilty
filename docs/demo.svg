    <rect x="32" y="2" width="28" height="20" rx="5" fill="#000" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.28;0.28;0.3;0.3;0.31;0.31;1" values="0;0;0.14;0.14;0.32;0.32;0;0" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1" /></rect>
