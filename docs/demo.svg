  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.12;0.13;0.23;0.25;1" values="0;0;1;1;0;0"/>
    <rect x="366.6" y="384" width="66.8" height="34" rx="17" fill="#1c1c1e" fill-opacity="0.82"/>
    <text x="400.0" y="406" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Fill</text>
  </g>
  <g opacity="0">
