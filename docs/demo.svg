    <path d="M7 4.2 C5.6 4.2 4.6 3.4 3.4 3.4 C1.6 3.4 0 4.9 0 7.6 C0 10.8 2.2 14.6 3.9 14.6 C4.9 14.6 5.4 14 6.9 14 C8.4 14 8.8 14.6 9.9 14.6 C11.4 14.6 12.8 12.2 13.4 10.6 C11.8 9.9 11 8.6 11 7.2 C11 5.9 11.7 4.9 12.6 4.3 C11.9 3.4 10.7 3.4 10.3 3.4 C9.1 3.4 8.2 4.2 7 4.2 Z"/>
    <path d="M7.1 3.1 C7 1.7 8.3 0.3 9.7 0.2 C9.8 1.7 8.5 3.1 7.1 3.1 Z"/>
  </g>
  <rect x="34" y="8" width="38" height="8" rx="4" fill="#1c1c1e" fill-opacity="0.55"/>
  <rect x="82" y="8" width="26" height="8" rx="4" fill="#1c1c1e" fill-opacity="0.35"/>
  <rect x="116" y="8" width="26" height="8" rx="4" fill="#1c1c1e" fill-opacity="0.35"/>
  <rect x="150" y="8" width="30" height="8" rx="4" fill="#1c1c1e" fill-opacity="0.35"/>
