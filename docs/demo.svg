    <animate attributeName="r" dur="12s" repeatCount="indefinite" keyTimes="0;0.3;0.3;0.34;1" values="0;0;4;18;18"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.3;0.3;0.34;1" values="0;0;0.9;0;0"/>
  </circle>
  <circle cx="144" cy="40" r="0" fill="none" stroke="#0a84ff" stroke-width="2" opacity="0">
    <animate attributeName="r" dur="12s" repeatCount="indefinite" keyTimes="0;0.47;0.47;0.5;1" values="0;0;4;18;18"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.47;0.47;0.5;1" values="0;0;0.9;0;0"/>
