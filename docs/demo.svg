    <rect x="343.6" y="384" width="112.8" height="34" rx="17" fill="#1c1c1e" fill-opacity="0.82"/>
    <text x="400.0" y="406" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Left half</text>
