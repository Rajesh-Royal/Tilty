    <path d="M655.5 12.6 a8 8 0 0 1 11 0 l-1.4 1.4 a6 6 0 0 0 -8.2 0 Z"/>
    <path d="M652.7 9.8 a12 12 0 0 1 16.6 0 l-1.4 1.4 a10 10 0 0 0 -13.8 0 Z"/>
