  <rect x="278" y="453" width="28" height="28" rx="7" fill="#5ac8fa"/><rect x="314" y="453" width="28" height="28" rx="7" fill="#34c759"/><rect x="350" y="453" width="28" height="28" rx="7" fill="#ff9f0a"/><rect x="386" y="453" width="28" height="28" rx="7" fill="#ff375f"/><rect x="422" y="453" width="28" height="28" rx="7" fill="#bf5af2"/><rect x="458" y="453" width="28" height="28" rx="7" fill="#64d2ff"/><rect x="494" y="453" width="28" height="28" rx="7" fill="#8e8e93"/>

