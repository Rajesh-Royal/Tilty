    <rect x="62" y="2" width="28" height="20" rx="5" fill="#000" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.45;0.45;0.47;0.47;0.47;0.48;0.65;0.65;0.67;0.67;0.67;0.68;1" values="0;0;0.14;0.14;0.32;0.32;0;0;0.14;0.14;0.32;0.32;0;0" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1" /></rect>
    <rect x="69.5" y="7" width="13" height="10" rx="2.2" fill="none" stroke="#3a3a3c" stroke-width="1.2"/><rect x="76" y="9" width="4.5" height="6" rx="1" fill="#3a3a3c"/>
