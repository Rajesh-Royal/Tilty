  <g transform="translate(624.5 5.4) scale(0.7)" fill="none" stroke="#1c1c1e" stroke-opacity="0.85" stroke-width="1.9">
    <rect x="2.65" y="2.65" width="4.7" height="12.7" rx="1.3"/>
    <rect x="10.65" y="2.65" width="4.7" height="4.7" rx="1.3"/>
    <rect x="10.65" y="10.65" width="4.7" height="4.7" rx="1.3"/>
  </g>
  <g fill="#1c1c1e" fill-opacity="0.75">
