<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Tilty</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="0.55" stop-color="#7b6fd6"/>
      <stop offset="1" stop-color="#e58a9a"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="60" rx="28" fill="#ffffff" fill-opacity="0.08"/>
  <!-- Same glyph as the menu bar icon: one tall tile, two stacked tiles -->
  <g fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linejoin="round">
    <rect x="33" y="30" width="26" height="68" rx="6"/>
    <rect x="69" y="30" width="26" height="29" rx="6"/>
    <rect x="69" y="69" width="26" height="29" rx="6"/>
  </g>
  <rect x="38.5" y="35.5" width="15" height="57" rx="3" fill="#ffffff" fill-opacity="0.3"/>
</svg>
