<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS app icon: 824pt body on a 1024 canvas, same design as docs/icon.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="0.55" stop-color="#7b6fd6"/>
      <stop offset="1" stop-color="#e58a9a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="412" rx="185" fill="#ffffff" fill-opacity="0.08"/>
  <g fill="none" stroke="#ffffff" stroke-width="44" stroke-linejoin="round">
    <rect x="262" y="250" width="180" height="524" rx="44"/>
    <rect x="582" y="250" width="180" height="222" rx="44"/>
    <rect x="582" y="552" width="180" height="222" rx="44"/>
  </g>
  <rect x="300" y="288" width="104" height="448" rx="22" fill="#ffffff" fill-opacity="0.3"/>
</svg>
